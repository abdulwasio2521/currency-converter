<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="container">
        <h2>Currency Converter</h2>
        <form>
            <div class="amount">
                <p id="enterAmount">Enter Amount</p>
                <input type="text" value="100">
            </div>
        
        <div class="dropdown">

            <div class="from">
                <p class="fromandtotext">From</p>
                <div class="select-container">
                    <img src="https://flagsapi.com/US/flat/64.png">
                    <select name="from">
                    </select>
                </div>
            </div>
            <i class="fa-solid fa-right-left"></i>
             <div class="to">
                <p class="fromandtotext">To</p>
                <div class="select-container">
                    <img src="https://flagsapi.com/PK/flat/64.png">
                    <select name="to">
                        
                    </select>
                </div>
                </div>
            </div>

            <div class="msg">
                <span id="fromValueUI">1</span>
                <span id="fromCurrencyUI">USD</span>
                 = 
                <span id="toValueUI">290</span>
                <span id="toCurrencyUI">PKR</span>
            </div>
            <button>Get Exchange Rate</button>
            </form>
        </div>
    </div>
    <script src="codes.js"></script>
    <script src="index.js"></script>
</body>
</html>
